[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "adaptiveedge"
version = "0.1.0"
description = "Reproducible language model benchmarking and evidence-based selection"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.10,<3", "PyYAML>=6,<7", "psutil>=6,<8", "typer>=0.15,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML", "types-psutil", "pre-commit>=4,<5", "build>=1,<2", "pip-audit>=2.10,<3", "httpx>=0.28,<1"]
ollama = ["httpx>=0.28,<1"]
transformers = ["transformers>=4.49,<6", "torch>=2.6,<3"]
plotting = ["matplotlib>=3.10,<4"]
gpu = ["nvidia-ml-py>=12,<14"]
all = ["adaptiveedge[ollama,transformers,plotting,gpu]"]

[project.scripts]
adaptiveedge = "adaptiveedge.cli.app:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["matplotlib", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=adaptiveedge --cov-branch --cov-report=term-missing"
markers = ["integration: portable end-to-end tests", "ollama: opt-in live Ollama", "transformers: optional Transformers runtime", "slow: long-running tests", "real_backend: opt-in real runtime", "gpu: optional GPU tests"]

[tool.coverage.run]
source = ["adaptiveedge"]
branch = true
